services:
  ie2_decision_intelligence:
    build:
      context: .
      dockerfile: services/decision_intelligence/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./data/real:/app/data/real:ro
      - ie2_models:/app/services/decision_intelligence/models
      - ie2_features:/app/services/decision_intelligence/data/features
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # IE1 — Market Intelligence (Mohammad Jawad)
  # ie1_market_intelligence:
  #   build:
  #     context: .
  #     dockerfile: services/market_intelligence/Dockerfile
  #   ports:
  #     - "8001:8001"

  # IE3 — Campaign Creative (Mohammad Farhat)
  ie3_campaign_creative:
    build:
      context: ..
      dockerfile: services/campaign_creative/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ../services/campaign_creative/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # EEP — Executive Platform (Mohammad Farhat)
  # eep:
  #   build:
  #     context: .
  #     dockerfile: eep/Dockerfile
  #   ports:
  #     - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.55.0
    depends_on:
      - ie2_decision_intelligence
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  ie2_models:
  ie2_features:
  prometheus_data:
  grafana_data:
