# Lightsail Load Balancers forward to attached instances on port 80.
# Traefik is exposed by k3s as NodePort 30080, so this DaemonSet binds host
# port 80 on every node and proxies traffic to the local Traefik NodePort.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lb-node-proxy-config
  namespace: retail-radar
data:
  default.conf: |
    server {
      listen 80;

      location / {
        proxy_pass http://127.0.0.1:30080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lb-node-proxy
  namespace: retail-radar
spec:
  selector:
    matchLabels:
      app: lb-node-proxy
  template:
    metadata:
      labels:
        app: lb-node-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              hostPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: lb-node-proxy-config
