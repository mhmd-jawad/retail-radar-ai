# Prometheus + Grafana, one replica each (stateful singletons). PVCs use k3s local-path.
# Scrapes the two services that expose /metrics today: EEP (instrumentator) and IE2 (make_asgi_app).
# (IE1/IE3 don't expose /metrics yet — add them here once they do.)
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: retail-radar }
data:
  prometheus.yml: |
    global: { scrape_interval: 30s, evaluation_interval: 30s }
    scrape_configs:
      - { job_name: eep, metrics_path: /metrics, static_configs: [{ targets: ["eep:8000"] }] }
      - { job_name: ie2, metrics_path: /metrics, static_configs: [{ targets: ["ie2:8002"] }] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prometheus-data, namespace: retail-radar }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 4Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: retail-radar }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      securityContext: { fsGroup: 65534, runAsUser: 65534, runAsNonRoot: true }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data,   mountPath: /prometheus }
          resources:
            requests: { cpu: "75m", memory: "192Mi" }
            limits:   { cpu: "400m", memory: "320Mi" }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data,   persistentVolumeClaim: { claimName: prometheus-data } }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: retail-radar }
spec: { selector: { app: prometheus }, ports: [{ port: 9090, targetPort: 9090 }] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: grafana-data, namespace: retail-radar }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: retail-radar }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext: { fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: "admin" }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: retail-secrets, key: GRAFANA_ADMIN_PASSWORD } } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
          volumeMounts: [{ name: data, mountPath: /var/lib/grafana }]
          resources:
            requests: { cpu: "40m", memory: "96Mi" }
            limits:   { cpu: "300m", memory: "192Mi" }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: grafana-data } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: retail-radar }
spec: { selector: { app: grafana }, ports: [{ port: 3000, targetPort: 3000 }] }
