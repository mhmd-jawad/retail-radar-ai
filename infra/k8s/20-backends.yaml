# ─────────────────────────────────────────── EEP — orchestrator / public API (8000)
apiVersion: apps/v1
kind: Deployment
metadata: { name: eep, namespace: retail-radar }
spec:
  selector: { matchLabels: { app: eep } }     # replica count owned by the HPA below (min 2)
  template:
    metadata: { labels: { app: eep } }
    spec:
      imagePullSecrets: [{ name: ghcr-creds }]
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: eep } } }
      containers:
        - name: eep
          image: ghcr.io/mhmd-jawad/retail-radar-eep:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: retail-config }
            - secretRef:    { name: retail-secrets }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits:   { cpu: "1000m", memory: "700Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: eep, namespace: retail-radar }
spec: { selector: { app: eep }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: eep, namespace: retail-radar }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: eep }
  minReplicas: 2
  maxReplicas: 4
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: eep, namespace: retail-radar }
spec: { minAvailable: 1, selector: { matchLabels: { app: eep } } }
