name: retail-radar

# Production stack for the Lightsail host. PostgreSQL stays in Amazon RDS and
# is supplied by DATABASE_URL in ../.env; this file never creates a database.
services:
  eep:
    build:
      context: ..
      dockerfile: eep/Dockerfile
      args:
        INSTALL_IE2: "true"
    env_file:
      - ../.env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_DATA_MODE: eep-live
        VITE_API_BASE_URL: ""
        VITE_IE2_BASE_URL: /ie2
        VITE_IE3_BASE_URL: /ie3
        VITE_API_KEY: ""
    depends_on:
      eep:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped

  telegram_assistant:
    build:
      context: ..
      dockerfile: services/telegram_assistant/Dockerfile
    env_file:
      - ../.env
    environment:
      TELEGRAM_POLLING_ENABLED: "false"
      TELEGRAM_DIRECT_ALERTS_ENABLED: "false"
      TELEGRAM_PROMOTION_NOTIFICATIONS_ENABLED: "false"
      TELEGRAM_CLOSED_LOOP_NOTIFICATIONS_ENABLED: "false"
      TELEGRAM_BUSINESS_ALERTS_ENABLED: "false"
      TELEGRAM_ROADMAP_FOLLOWUPS_ENABLED: "false"
    depends_on:
      eep:
        condition: service_healthy
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      eep:
        condition: service_healthy
      frontend:
        condition: service_started
      telegram_assistant:
        condition: service_healthy
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Optional standalone APIs. EEP already carries IE2 model inference in its
  # own image, avoiding a second model copy on a small Lightsail instance.
  ie1_market_intelligence:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: services/market_intelligence/Dockerfile
    env_file:
      - ../.env
    expose:
      - "8001"
    restart: unless-stopped

  ie2_decision_intelligence:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: services/decision_intelligence/Dockerfile
    env_file:
      - ../.env
    expose:
      - "8002"
    restart: unless-stopped

  ie3_campaign_creative:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: services/campaign_creative/Dockerfile
    env_file:
      - ../.env
    expose:
      - "8003"
    volumes:
      - campaign_static:/app/services/campaign_creative/static
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    depends_on:
      eep:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  campaign_static:
  prometheus_data:
  grafana_data:
