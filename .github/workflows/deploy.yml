# ─────────────────────────────────────────────────────────────────────────────
#  Retail Radar AI — CI/CD Pipeline
#
#  Trigger: push to `main` or `dev`
#  Flow:  test → build-push (6 images → ghcr.io) → deploy (kubectl on Box B)
#
#  Required GitHub Secrets (Settings → Secrets and variables → Actions):
#    BOX_B_HOST      — public IP of the k3s server node (Box B)
#    BOX_B_USER      — SSH username on Box B (e.g. ubuntu)
#    BOX_B_SSH_KEY   — private SSH key that can log into Box B
#    VITE_API_KEY    — frontend API key baked into the JS bundle (can be empty)
#    VITE_GRAFANA_URL— Grafana URL shown in the dashboard (can be empty)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Test → Build → Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:   # "Run workflow" button in the GitHub UI

# Cancel any in-flight run for the same branch when a newer push arrives
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: mhmd-jawad   # must match the GitHub account that owns the packages

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Unit Tests
# Skip tests that need a live database (files named *live*).
# Add RETAIL_* env vars here if any unit test needs them.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Quality signal, not a hard gate — a red test won't block the deploy.
    # Remove this line once the unit suite is reliably green to enforce a strict gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install --no-cache-dir \
            pytest pytest-asyncio httpx \
            -r eep/requirements.txt \
            -r services/decision_intelligence/requirements.txt \
            -r services/market_intelligence/requirements.txt \
            -r services/campaign_creative/requirements.txt

      - name: Run unit tests (skip live-DB tests)
        run: |
          pytest tests/unit -x -q \
            --ignore=tests/unit/test_rds_live_reads.py \
            --ignore=tests/unit/test_live_rds_competitor_eval.py
        env:
          PYTHONPATH: .

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Build & push all 6 Docker images to ghcr.io
#   Each image is tagged with the 7-char git SHA AND `latest`.
#   Build cache is stored in GitHub's cache store (type=gha) per image scope.
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # allows GITHUB_TOKEN to push to ghcr.io
    outputs:
      sha: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── EEP (orchestrator / API gateway) ─────────────────────────────────
      - name: Build & Push — EEP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: eep/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/retail-radar-eep:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.OWNER }}/retail-radar-eep:latest
          cache-from: type=gha,scope=eep
          cache-to:   type=gha,scope=eep,mode=max

      # ── IE1 — market_intelligence ─────────────────────────────────────────
      - name: Build & Push — IE1 (market_intelligence)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/market_intelligence/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/retail-radar-ie1:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.OWNER }}/retail-radar-ie1:latest
          cache-from: type=gha,scope=ie1
          cache-to:   type=gha,scope=ie1,mode=max

      # ── IE2 — decision_intelligence (the ML model service) ───────────────
      - name: Build & Push — IE2 (decision_intelligence)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/decision_intelligence/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/retail-radar-ie2:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.OWNER }}/retail-radar-ie2:latest
          cache-from: type=gha,scope=ie2
          cache-to:   type=gha,scope=ie2,mode=max

      # ── IE3 — campaign_creative ───────────────────────────────────────────
      - name: Build & Push — IE3 (campaign_creative)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/campaign_creative/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/retail-radar-ie3:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.OWNER }}/retail-radar-ie3:latest
          cache-from: type=gha,scope=ie3
          cache-to:   type=gha,scope=ie3,mode=max

      # ── Frontend (React → nginx) ──────────────────────────────────────────
      - name: Build & Push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_DATA_MODE=eep-live
            VITE_API_BASE_URL=/api
            VITE_IE1_BASE_URL=/ie1
            VITE_IE2_BASE_URL=/ie2
            VITE_IE3_BASE_URL=/ie3
            VITE_ASSISTANT_URL=/assistant-api
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
            VITE_GRAFANA_URL=${{ secrets.VITE_GRAFANA_URL }}
          tags: |
            ghcr.io/${{ env.OWNER }}/retail-radar-frontend:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.OWNER }}/retail-radar-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      # ── Telegram assistant ────────────────────────────────────────────────
      - name: Build & Push — Telegram
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/telegram_assistant/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/retail-radar-telegram:${{ steps.sha.outputs.short }}
            ghcr.io/${{ env.OWNER }}/retail-radar-telegram:latest
          cache-from: type=gha,scope=telegram
          cache-to:   type=gha,scope=telegram,mode=max

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Deploy to k3s (Box B — the k3s server node on AWS)
#
#   SSH into Box B, pull the latest manifests, patch kustomization.yaml
#   with the new SHA tag (without committing), apply, and wait for rollout.
#   kustomization.yaml is restored to its git state after apply so the next
#   `git pull` stays clean.
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to k3s (AWS Lightsail)
    needs: build
    runs-on: ubuntu-latest
    environment: production   # optional: adds an approval gate in GitHub UI

    steps:
      - name: SSH deploy to Box B
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.BOX_B_HOST }}
          username: ${{ secrets.BOX_B_USER }}
          key:      ${{ secrets.BOX_B_SSH_KEY }}
          script: |
            set -e
            SHA="${{ needs.build.outputs.sha }}"
            BRANCH="${{ github.ref_name }}"

            # Make `kubectl` work for this SSH user (k3s writes its kubeconfig as root, mode 600).
            if [ ! -f "$HOME/.kube/config" ]; then
              mkdir -p "$HOME/.kube"
              sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
              sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
            fi
            export KUBECONFIG="$HOME/.kube/config"

            echo "▶ Syncing branch $BRANCH on Box B (force-match GitHub)..."
            cd ~/retail-radar-ai
            git fetch --all --prune
            git checkout -f "$BRANCH"
            # Hard-reset to remote so any manual edits made on Box B during the
            # hand-deploy are overwritten by what CI built. (k8s.env / pgbouncer.env
            # are git-ignored, so the live secrets on Box B are NOT touched.)
            git reset --hard "origin/$BRANCH"

            echo "▶ Patching image tags to $SHA..."
            # Replace every  newTag: <anything>  line in kustomization.yaml.
            # All six images share the same tag in this repo, so one sed suffices.
            sed -i "s/newTag: .*/newTag: $SHA/g" infra/k8s/kustomization.yaml

            echo "▶ Applying Kustomize stack..."
            kubectl apply -k infra/k8s/

            echo "▶ Waiting for rollouts to complete (5 min timeout each)..."
            kubectl rollout status deployment/eep      -n retail-radar --timeout=300s
            kubectl rollout status deployment/frontend -n retail-radar --timeout=300s
            kubectl rollout status deployment/ie1      -n retail-radar --timeout=300s
            kubectl rollout status deployment/ie2      -n retail-radar --timeout=300s
            kubectl rollout status deployment/ie3      -n retail-radar --timeout=300s
            kubectl rollout status deployment/telegram -n retail-radar --timeout=300s

            echo "▶ Restoring kustomization.yaml to keep git tree clean..."
            git checkout infra/k8s/kustomization.yaml

            echo ""
            echo "✅  retail-radar deployed @ $SHA  (branch: $BRANCH)"
            kubectl get pods -n retail-radar
